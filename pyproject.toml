[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "nexus-publicity-manager-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "psycopg[binary,pool]>=3.2,<4", "alembic>=1.14,<2", "httpx>=0.28,<1", "cryptography>=44", "itsdangerous>=2.2,<3", "google-auth>=2.38", "google-auth-oauthlib>=1.2", "google-api-python-client>=2.160", "anthropic>=0.80", "dnspython>=2.7", "rapidfuzz>=3.12", "holidays>=0.65", "structlog>=25", "beautifulsoup4>=4.13", "honcho>=2", "nh3>=0.2.17,<1"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "types-requests"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["pruebas"]
[tool.ruff]
line-length = 100
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
